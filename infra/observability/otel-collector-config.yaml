# OpenTelemetry Collector configuration for local development.
# Receives OTLP traces/metrics from api, realtime, worker, and scheduler
# (see OTEL_EXPORTER_OTLP_ENDPOINT in .env.example) and forwards them to
# Prometheus (metrics) and a tracing backend (traces).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  # Defense in depth: drop any attribute that could carry a secret if a
  # producer misconfigures instrumentation.
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: cookie
        action: delete
      - key: http.request.header.authorization
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [prometheus, debug]
