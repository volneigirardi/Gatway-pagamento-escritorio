services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-saas_admin}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  database-roles:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrate
    command:
      ["node", "--experimental-strip-types", "scripts/bootstrap-roles.ts"]
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD required}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?MIGRATION_DATABASE_PASSWORD required}
      PROVISIONER_DATABASE_PASSWORD: ${PROVISIONER_DATABASE_PASSWORD:?PROVISIONER_DATABASE_PASSWORD required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrate
    command:
      [
        "node",
        "--experimental-strip-types",
        "scripts/run-migrations.ts",
        "up",
        "admin",
      ]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL required}
    depends_on:
      database-roles:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?REDIS_PASSWORD required}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2026-01-29T03-56-32Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER required}
      JWT_PLATFORM_AUDIENCE: ${JWT_PLATFORM_AUDIENCE:-blupo-platform}
      JWT_TENANT_AUDIENCE: ${JWT_TENANT_AUDIENCE:-blupo-tenant}
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3000:3000"
    depends_on:
      migrate-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  realtime:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.realtime
    environment:
      NODE_ENV: development
      PORT: 3002
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER required}
      JWT_PLATFORM_AUDIENCE: ${JWT_PLATFORM_AUDIENCE:-blupo-platform}
      JWT_TENANT_AUDIENCE: ${JWT_TENANT_AUDIENCE:-blupo-tenant}
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      NODE_ENV: development
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL required}
      TENANT_PROVISIONER_DATABASE_URL: ${TENANT_PROVISIONER_DATABASE_URL:?TENANT_PROVISIONER_DATABASE_URL required}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      redis:
        condition: service_healthy
      migrate-admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.scheduler
    environment:
      NODE_ENV: development
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      redis:
        condition: service_healthy
      migrate-admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
