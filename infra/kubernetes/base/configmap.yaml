apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-config
  namespace: saas
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TRUSTED_PROXIES: "true"
  RATE_LIMIT_TTL_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  WS_PING_TIMEOUT_MS: "20000"
  WS_PING_INTERVAL_MS: "5000"
  WS_MAX_HTTP_BUFFER_SIZE: "1000000"
  WORKER_CONCURRENCY: "10"
  WORKER_SHUTDOWN_TIMEOUT_MS: "30000"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.saas.svc.cluster.local:4318"
  # CORS_ORIGINS is environment-specific; override per overlay (dev/staging/prod).
  CORS_ORIGINS: "https://app.example.com"
