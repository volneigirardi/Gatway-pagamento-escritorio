apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-config
  namespace: saas
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TRUSTED_PROXIES: "loopback,linklocal,uniquelocal"
  DATABASE_POOL_MIN: "1"
  DATABASE_POOL_MAX: "5"
  DATABASE_TIMEOUT: "30000"
  TENANT_POOL_CACHE_MAX: "10"
  TENANT_DATABASE_POOL_MAX: "1"
  RATE_LIMIT_TTL_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  WS_PING_TIMEOUT_MS: "20000"
  WS_PING_INTERVAL_MS: "5000"
  WS_MAX_HTTP_BUFFER_SIZE: "1000000"
  WORKER_CONCURRENCY: "10"
  TENANT_PROVISIONING_CONCURRENCY: "2"
  WORKER_SHUTDOWN_TIMEOUT_MS: "30000"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.saas.svc.cluster.local:4318"
  # CORS_ORIGINS is environment-specific; override per overlay (dev/staging/prod).
  CORS_ORIGINS: "https://app.blupo.com.br"
  JWT_ISSUER: "https://app.blupo.com.br"
  JWT_PLATFORM_AUDIENCE: "blupo-platform"
  JWT_TENANT_AUDIENCE: "blupo-tenant"
  JWT_KEY_ID: "blupo-key-1"
