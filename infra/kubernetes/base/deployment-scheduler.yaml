apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: saas
  labels:
    app: scheduler
spec:
  # Exactly one active scheduler to avoid duplicate scheduled jobs; BullMQ
  # repeatable jobs are idempotent by job ID, but keep replicas at 1 to
  # avoid unnecessary duplicate tick evaluation.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      serviceAccountName: saas-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: saas/scheduler:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: saas-config
            - secretRef:
                name: saas-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "250m"
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
