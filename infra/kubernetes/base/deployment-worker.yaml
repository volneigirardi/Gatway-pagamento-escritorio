apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: saas
  labels:
    app: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: saas-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: saas/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: saas-config
            - secretRef:
                name: saas-database-runtime-secrets
            - secretRef:
                name: saas-redis-runtime-secrets
            - secretRef:
                name: saas-migration-secrets
            - secretRef:
                name: saas-provisioner-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: 192Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          # No HTTP surface: liveness relies on the process being alive.
          # BullMQ job processing failures surface via metrics/logs, not probes.
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
