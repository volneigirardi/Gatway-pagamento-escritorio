# One-shot migration Job. Never run migrations from every replica's
# startup — apply this Job (or trigger it from CI) before rolling out a new
# Deployment revision that depends on the new schema (expand-and-contract).
apiVersion: batch/v1
kind: Job
metadata:
  # Suffix with a version/revision when applying (e.g. migrate-2026-08-22-01)
  # so re-running a migration set never collides with a completed Job.
  name: migrate
  namespace: saas
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: saas-app
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: saas/migrate:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: saas-config
            - secretRef:
                name: saas-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
