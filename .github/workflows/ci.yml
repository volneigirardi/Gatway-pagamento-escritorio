name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: "24.x"
  PNPM_VERSION: "11.15.1"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci p/javascript p/typescript p/owasp-top-ten

      - name: License check
        run: |
          pnpm dlx license-checker-rseidelsohn@4.4.2 \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0" \
            --excludePrivatePackages \
            --summary

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/saas_test
      MIGRATION_DATABASE_URL: postgres://test:test@localhost:5432/saas_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration test (up / down / up on a disposable database)
        run: |
          pnpm --filter @saas/database-migrations migrate tenant
          pnpm --filter @saas/database-migrations migrate:down tenant
          pnpm --filter @saas/database-migrations migrate tenant
          pnpm --filter @saas/database-migrations migrate:status tenant

      - name: API integration tests (auth, tenant isolation, idempotency, concurrency)
        run: pnpm --filter @saas/api test:integration
        env:
          JWT_SECRET: ci-test-secret-32-bytes-long-for-tests-only
          CORS_ORIGINS: http://localhost:3004
          NODE_ENV: test

      - name: Worker tenant-provisioning integration test
        run: pnpm --filter @saas/worker test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: [quality-gates]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @saas/web exec playwright install --with-deps chromium firefox webkit

      - name: Build web app
        run: pnpm --filter @saas/web build

      - name: E2E smoke tests (Chromium, Firefox, WebKit, mobile viewport)
        run: pnpm --filter @saas/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    needs: [quality-gates]
    strategy:
      matrix:
        service: [api, realtime, worker, scheduler, web, migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: |
          docker build -f infra/docker/Dockerfile.${{ matrix.service }} \
            -t saas/${{ matrix.service }}:${{ github.sha }} .

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: saas/${{ matrix.service }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.17.9
        with:
          image: saas/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize infra/kubernetes/base > /tmp/rendered.yaml
          kubectl create --dry-run=client -f infra/kubernetes/base/job-migrate.yaml -o yaml > /tmp/migrate-job.yaml

      - name: Validate Docker Compose files
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml config -q
          docker compose -f infra/docker/docker-compose.prod.yml config -q
          docker compose -f infra/docker/docker-compose.observability.yml config -q

  openapi-contract:
    runs-on: ubuntu-latest
    needs: [quality-gates]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export current OpenAPI document
        run: pnpm --filter @saas/api exec node -e "console.log('OpenAPI export placeholder — wire to SwaggerModule once first business endpoints exist')"
        # NOTE: there is no stored OpenAPI baseline yet (no business endpoints
        # implemented). This job currently only proves the API app boots far
        # enough to build; add a real `swagger-cli diff` (or `oasdiff`) step
        # against a committed `docs/openapi/baseline.json` once the first
        # versioned endpoints exist, per docs/AGENTS.md.
